<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F3A5F"/>
      <stop offset="1" stop-color="#0B1626"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22324A"/>
      <stop offset="1" stop-color="#151F30"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#bg)"/>
  <!-- 芯片引脚 -->
  <g fill="#6FA8DC">
    <rect x="70" y="30" width="12" height="22" rx="3"/><rect x="98" y="30" width="12" height="22" rx="3"/>
    <rect x="126" y="30" width="12" height="22" rx="3"/><rect x="154" y="30" width="12" height="22" rx="3"/>
    <rect x="70" y="204" width="12" height="22" rx="3"/><rect x="98" y="204" width="12" height="22" rx="3"/>
    <rect x="126" y="204" width="12" height="22" rx="3"/><rect x="154" y="204" width="12" height="22" rx="3"/>
    <rect x="30" y="74" width="22" height="12" rx="3"/><rect x="30" y="102" width="22" height="12" rx="3"/>
    <rect x="30" y="130" width="22" height="12" rx="3"/><rect x="30" y="158" width="22" height="12" rx="3"/>
  </g>
  <!-- 芯片本体 -->
  <rect x="48" y="48" width="160" height="160" rx="18" fill="url(#chip)" stroke="#6FA8DC" stroke-width="5"/>
  <!-- 十六进制字节格子：第二行为差异 -->
  <g font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="26" text-anchor="middle">
    <g fill="#9CC4EA">
      <text x="84" y="92">4F</text><text x="128" y="92">0A</text><text x="172" y="92">7E</text>
    </g>
    <rect x="62" y="104" width="44" height="32" rx="6" fill="#E5533D"/>
    <g fill="#9CC4EA"><text x="128" y="129">C3</text><text x="172" y="129">10</text></g>
    <text x="84" y="129" fill="#FFFFFF">FF</text>
  </g>
  <!-- ++ -->
  <g fill="#FFB020">
    <rect x="78" y="160" width="40" height="12" rx="4"/><rect x="92" y="146" width="12" height="40" rx="4"/>
    <rect x="138" y="160" width="40" height="12" rx="4"/><rect x="152" y="146" width="12" height="40" rx="4"/>
  </g>
  <!-- 右侧引脚 -->
  <g fill="#6FA8DC">
    <rect x="204" y="74" width="22" height="12" rx="3"/><rect x="204" y="102" width="22" height="12" rx="3"/>
    <rect x="204" y="130" width="22" height="12" rx="3"/><rect x="204" y="158" width="22" height="12" rx="3"/>
  </g>
</svg>
